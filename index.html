<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/favicon.png">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Interface de Androides SC-RPG</title>
    <link rel="stylesheet" href="sna.css?t=1783272137">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>

<body class="sna-has-nav">

<!--#include nav-->

    <div id="entry-screen" class="entry-screen active">
        <img src="img/logo.svg?t=1783272137" alt="Spaceships and Aliens" id="entry-logo" class="entry-logo" width="200"
            height="auto">
        <p id="entry-subtitle" class="entry-subtitle">Sistema de Exploração Interestelar</p>
        <div id="entry-form" class="entry-form">
            <input type="text" id="entry-code" placeholder="Cole o link do mestre aqui…" autocomplete="off" autofocus>
            <div class="btn-row" style="gap:6px">
                <button class="btn btn-primary" onclick="joinCampaign()">Entrar no jogo</button>
                <button class="btn btn-secondary" onclick="openQrScanner()"
                    style="font-size:0.82rem;padding:8px 14px"><i class="bi bi-camera"></i> Entrar por QrCode</button>
            </div>
        </div>
        <div id="qr-scanner-modal"
            style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:999;align-items:center;justify-content:center">
            <div
                style="width:100%;max-width:360px;background:var(--card-bg);border:1px solid var(--border-color);padding:16px;border-radius:8px">
                <div style="text-align:right;margin-bottom:6px">
                    <button class="btn btn-xs btn-secondary" onclick="closeQrScanner()"
                        style="font-size:0.75rem">Fechar</button>
                </div>
                <div id="qr-reader"
                    style="width:100%;min-height:280px;background:#000;border-radius:4px;overflow:hidden"></div>
                <div id="qr-error"
                    style="display:none;color:#f56c6c;font-size:0.75rem;margin-top:8px;text-align:center"></div>
            </div>
        </div>
        <p id="entry-error" style="display:none;color:#f56c6c;font-size:0.8rem;margin-top:8px"></p>
        <p id="entry-hint" class="entry-hint">Cole o link P2P fornecido pelo mestre para conectar.</p>
        <div id="entry-divider" class="entry-divider"></div>
        <a href="missioncontrol.html" id="entry-back-mc" class="btn btn-secondary">Entrar como Mestre do Jogo</a>
        <a href="https://www.paypal.com/donate/?business=vanheber@gmail.com" target="_blank" rel="noopener"
            id="entry-donate" class="entry-donate"><i class="bi bi-cup-hot"></i> Apoie o
            Projeto</a>
    </div>

    <div id="news-section" class="news-section">
        <div class="news-title"><i class="bi bi-newspaper"></i> Pulso do Autor</div>
        <div class="news-grid" id="news-grid"></div>
    </div>

    <script>
        // Fase E4: o portal só encaminha para play.html — a sala de jogo é
        // lá (catálogo, ficha, sessão e modo local morreram daqui).
        // ?join= legado (QR antigo, bookmark de index.html) é repassado.
        var _join = /[?&]join=([^&\s#]*)/.exec(location.search);
        if (_join) location.replace("play.html?join=" + _join[1]);

        function esc(s) { return String(s).replace(/[&<>"']/g, function(m){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]; }); }

        function joinCampaign() {
            var v = document.getElementById("entry-code").value.trim();
            var errorEl = document.getElementById("entry-error");
            if (!v) {
                errorEl.textContent = "Cole o link P2P do mestre para conectar.";
                errorEl.style.display = "block";
                return;
            }
            errorEl.style.display = "none";
            var m = /[?&]join=([^&\s#]*)/.exec(v);
            location.replace("play.html?join=" + (m ? m[1] : encodeURIComponent(v)));
        }

        var _qrScanner = null;

        function openQrScanner() {
            var modal = document.getElementById("qr-scanner-modal");
            var errorEl = document.getElementById("qr-error");
            modal.style.display = "flex";
            errorEl.style.display = "none";

            if (typeof Html5Qrcode === "undefined") {
                errorEl.textContent = "Biblioteca de scanner não carregada. Use o link manualmente.";
                errorEl.style.display = "block";
                return;
            }

            if (_qrScanner) {
                try { _qrScanner.stop().catch(function () { }); } catch (e) { }
                _qrScanner = null;
            }

            _qrScanner = new Html5Qrcode("qr-reader", { verbose: false });
            _qrScanner.start(
                { facingMode: "environment" },
                {
                    fps: 10,
                    qrbox: function (viewfinderWidth, viewfinderHeight) {
                        var min = Math.min(viewfinderWidth, viewfinderHeight);
                        var size = Math.floor(min * 0.75);
                        return { width: size, height: size };
                    },
                    aspectRatio: 1,
                    experimentalFeatures: { useBarCodeDetectorIfSupported: true }
                },
                function (decodedText) {
                    try { _qrScanner.stop(); } catch (e) { }
                    closeQrScanner();
                    document.getElementById("entry-code").value = decodedText;
                    joinCampaign();
                },
                function () { } // ignore scan errors
            ).catch(function (e) {
                errorEl.textContent = "Erro na câmera: " + (e.message || e);
                errorEl.style.display = "block";
            });
        }

        function closeQrScanner() {
            if (_qrScanner) {
                try { _qrScanner.stop().catch(function () { }); } catch (e) { }
                _qrScanner = null;
            }
            document.getElementById("qr-scanner-modal").style.display = "none";
        }

        async function loadNewsFeed() {
            try {
                var res = await fetch("https://runaris.com.br/ghost/news/news.json");
                if (!res.ok) return;
                var data = await res.json();
                if (data.news && data.news.length) renderNewsCards(data.news);
            } catch (e) { }
        }

        function renderNewsCards(items) {
            var section = document.getElementById("news-section");
            var grid = document.getElementById("news-grid");
            section.style.display = "block";
            grid.innerHTML = "";
            items.forEach(function (item) {
                var card = document.createElement("a");
                card.className = "news-card" + (item.size === "large" ? " large" : "");
                card.href = item.url;
                card.target = "_blank";
                card.rel = "noopener";
                var badge = item.type === "novidade" ? '<i class="bi bi-stars"></i>' : item.type === "video" ? '<i class="bi bi-play-circle"></i>' : '<i class="bi bi-rocket-takeoff"></i>';
                card.innerHTML =
                    (item.image ? '<img src="' + item.image + '" alt="" class="news-card-img" loading="lazy">' : "") +
                    '<div class="news-card-body">' +
                    '<span class="news-badge ' + esc(item.type || "") + '">' + badge + " " + esc(item.type) + "</span>" +
                    '<div class="news-card-title">' + esc(item.title) + "</div>" +
                    '<div class="news-card-text">' + esc(item.content) + "</div>" +
                    "</div>";
                grid.appendChild(card);
            });
        }

        loadNewsFeed();

        // ServiceWorker
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("/sw.js?v=4").catch(function (e) { console.warn("Spaceships and Aliens: SW registration failed", e); });
        }
    </script>

<!--#include footer-->

</body>

</html>
