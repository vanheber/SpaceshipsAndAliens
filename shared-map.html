<script>
(function () {
    var root = document.getElementById("map-root");
    var currentSeed = null;

    function renderEmpty() {
        root.innerHTML =
            '<div class="shared-map-wrap">' +
                '<div class="shared-map-empty">' +
                    '<i class="bi bi-map"></i>' +
                    '<p>Nenhum mapa compartilhado no momento.</p>' +
                    '<p style="font-size:.82em;margin-top:8px">' +
                        'O mestre precisa gerar uma descoberta no Gerador de Missão ' +
                        'e clicar em <strong>Compartilhar Mapa</strong>.</p>' +
                '</div>' +
            '</div>';
    }

    function renderMap(data) {
        var palLabel = data.paletteKey || "desconhecido";
        var encLabel = data.encounterType || "";
        var planetName = data.planetName || "";
        var ts = new Date(data.timestamp || Date.now());
        root.innerHTML =
            '<div class="shared-map-wrap">' +
                '<div class="shared-map-info">' +
                    '<span class="map-badge"><i class="bi bi-broadcast"></i> AO VIVO</span>' +
                    ' &nbsp;' +
                    (planetName ? '<strong>' + esc(planetName) + '</strong> &nbsp;' : '') +
                    (encLabel ? '<span class="map-badge">' + esc(encLabel) + '</span> &nbsp;' : '') +
                    '<span class="map-badge">' + esc(palLabel) + '</span>' +
                '</div>' +
                '<div class="shared-map-view" id="shared-map-view"></div>' +
            '</div>';
        var container = document.getElementById("shared-map-view");
        if (data.seed != null && data.roomCount != null && data.paletteKey) {
            disposeDiscoveryMap("shared-map-view");
            currentSeed = data.seed;
            buildSharedMap("shared-map-view", data.seed, data.roomCount, data.paletteKey);
        }
    }

    function esc(s) {
        if (typeof s !== "string") return "";
        return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function loadFromStorage() {
        try {
            var raw = localStorage.getItem("warp-shared-map");
            if (raw) {
                var data = JSON.parse(raw);
                if (data.seed != null) return renderMap(data);
            }
        } catch (e) {}
        renderEmpty();
    }

    loadFromStorage();

    // Listen for real-time updates via BroadcastChannel
    if (typeof BroadcastChannel !== "undefined") {
        var ch = new BroadcastChannel("warp-unit");
        ch.onmessage = function (e) {
            if (e.data && e.data.type === "shared-map") {
                try {
                    localStorage.setItem("warp-shared-map", JSON.stringify(e.data.data));
                } catch (e) {}
                renderMap(e.data.data);
            }
        };
    }

    // Listen for localStorage changes from other tabs
    window.addEventListener("storage", function (e) {
        if (e.key === "warp-shared-map" && e.newValue) {
            try {
                var data = JSON.parse(e.newValue);
                if (data.seed != null && data.seed !== currentSeed) renderMap(data);
            } catch (e) {}
        }
    });

    // Listen for P2P shared-map messages (remote players)
    function initP2P() {
        if (typeof WarpP2P === "undefined" || typeof WarpP2P.on !== "function") return;
        WarpP2P.on("message", function (msg) {
            if (msg && msg.type === "shared-map" && msg.data) {
                try { localStorage.setItem("warp-shared-map", JSON.stringify(msg.data)); } catch (e) {}
                renderMap(msg.data);
            }
        });
    }
    if (document.readyState === "complete") initP2P();
    else window.addEventListener("load", initP2P);
})();
</script>
