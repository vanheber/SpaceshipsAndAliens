<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/favicon.png">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>WARP-Unit | Mini-Mapa</title>
    <link rel="stylesheet" href="warp.css?t=1783272137">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="js/store.js?t=1783272137"></script>
    <script src="js/p2p.js?t=1783272137"></script>
    <script src="js/p2p-hub.js?t=1783272137"></script>
    <script src="js/procgen-map.js?t=1783779360"></script>
    <style>
        .shared-map-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 20px 0;
        }
        .shared-map-info {
            text-align: center;
            font-size: .9em;
            opacity: .8;
            line-height: 1.5;
        }
        .shared-map-info strong { color: var(--accent-hope); }
        .shared-map-view {
            width: 100%;
            max-width: 1000px;
            aspect-ratio: 1 / 1;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            touch-action: none;
            margin: 0 auto;
        }
        @media (max-width: 767px) {
            .shared-map-view { max-width: 320px; }
        }
        @media (min-width: 768px) and (max-width: 1023px) {
            .shared-map-view { max-width: 600px; }
        }
        .shared-map-empty {
            text-align: center;
            padding: 80px 20px;
            opacity: .5;
        }
        .shared-map-empty i { font-size: 3em; display: block; margin-bottom: 16px; }
        .shared-map-empty p { font-size: 1em; margin: 0; }
        .map-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: .78em;
            background: rgba(167, 139, 250, .12);
            color: var(--accent-hope);
            border: 1px solid rgba(167, 139, 250, .2);
        }
        .map-badge.offline {
            background: rgba(245, 108, 108, .1);
            color: var(--accent-fear);
            border-color: rgba(245, 108, 108, .2);
        }
    </style>
</head>
<body class="warp-has-nav">

<!--#include nav-->

<header>
    <h1>SISTEMA OPERACIONAL WARP</h1>
    <p>Mini-Mapa &mdash; Mapa Compartilhado pelo Mestre</p>
</header>

<div id="map-root"></div>

<!--#include footer-->

<script>
(function () {
    var root = document.getElementById("map-root");
    var currentSeed = null;

    function renderEmpty() {
        root.innerHTML =
            '<div class="shared-map-wrap">' +
                '<div class="shared-map-empty">' +
                    '<i class="bi bi-map"></i>' +
                    '<p>Nenhum mapa compartilhado no momento.</p>' +
                    '<p style="font-size:.82em;margin-top:8px">' +
                        'O mestre precisa gerar uma descoberta no Gerador de Missão ' +
                        'e clicar em <strong>Compartilhar Mapa</strong>.</p>' +
                '</div>' +
            '</div>';
    }

    function renderMap(data) {
        var palLabel = data.paletteKey || "desconhecido";
        var encLabel = data.encounterType || "";
        var planetName = data.planetName || "";
        var ts = new Date(data.timestamp || Date.now());
        root.innerHTML =
            '<div class="shared-map-wrap">' +
                '<div class="shared-map-info">' +
                    '<span class="map-badge"><i class="bi bi-broadcast"></i> AO VIVO</span>' +
                    ' &nbsp;' +
                    (planetName ? '<strong>' + esc(planetName) + '</strong> &nbsp;' : '') +
                    (encLabel ? '<span class="map-badge">' + esc(encLabel) + '</span> &nbsp;' : '') +
                    '<span class="map-badge">' + esc(palLabel) + '</span>' +
                '</div>' +
                '<div class="shared-map-view" id="shared-map-view"></div>' +
            '</div>';
        var container = document.getElementById("shared-map-view");
        if (data.seed != null && data.roomCount != null && data.paletteKey) {
            disposeDiscoveryMap("shared-map-view");
            currentSeed = data.seed;
            buildSharedMap("shared-map-view", data.seed, data.roomCount, data.paletteKey);
        }
    }

    function esc(s) {
        if (typeof s !== "string") return "";
        return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function loadFromStorage() {
        try {
            var raw = localStorage.getItem("warp-shared-map");
            if (raw) {
                var data = JSON.parse(raw);
                if (data.seed != null) return renderMap(data);
            }
        } catch (e) { console.warn("WARP-Unit:", e); }
        renderEmpty();
    }

    loadFromStorage();

    // Listen for real-time updates via BroadcastChannel
    if (typeof BroadcastChannel !== "undefined") {
        var ch = new BroadcastChannel("warp-unit");
        ch.onmessage = function (e) {
            if (e.data && e.data.type === "shared-map") {
                try {
                    localStorage.setItem("warp-shared-map", JSON.stringify(e.data.data));
                } catch (e) { console.warn("WARP-Unit:", e); }
                renderMap(e.data.data);
            }
        };
    }

    // Listen for localStorage changes from other tabs
    window.addEventListener("storage", function (e) {
        if (e.key === "warp-shared-map" && e.newValue) {
            try {
                var data = JSON.parse(e.newValue);
                if (data.seed != null && data.seed !== currentSeed) renderMap(data);
            } catch (e) { console.warn("WARP-Unit:", e); }
        }
    });

    // Listen for P2P shared-map messages (remote players)
    function initP2P() {
        if (typeof WarpP2P === "undefined" || typeof WarpP2P.on !== "function") return;
        WarpP2P.on("message", function (msg) {
            if (msg && msg.type === "shared-map" && msg.data) {
                try { localStorage.setItem("warp-shared-map", JSON.stringify(msg.data)); } catch (e) { console.warn("WARP-Unit:", e); }
                renderMap(msg.data);
            }
        });
    }
    if (document.readyState === "complete") initP2P();
    else window.addEventListener("load", initP2P);
})();
</script>



<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js?v=4").catch(function (e) { console.warn("WARP-Unit: SW registration failed", e); });
}
</script>

</body>
</html>
