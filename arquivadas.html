<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/favicon.png">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="stylesheet" href="sna.css?t=1783272137">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .archived-wrap { max-width: 700px; width: 100%; margin: 0 auto; padding: 16px; }
        .archived-wrap h1 { color: var(--accent-hope); font-size: 1.3rem; margin-bottom: 4px; }
        .archived-wrap .sub { color: #888; font-size: 0.82rem; margin-bottom: 20px; }
        .arch-item { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 12px 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; }
        .arch-item .info { flex: 1; min-width: 0; }
        .arch-item .info .name { font-weight: 600; font-size: 0.92rem; }
        .arch-item .info .meta { font-size: 0.78rem; color: #888; margin-top: 2px; }
        .arch-item .actions { display: flex; gap: 6px; flex-shrink: 0; }
        .arch-item .actions button { font-size: 0.78rem; padding: 4px 12px; border-radius: 4px; border: 1px solid var(--border-color); cursor: pointer; background: var(--card-hover); color: var(--text-color); }
        .arch-item .actions .restore { border-color: var(--accent-hope); color: var(--accent-hope); }
        .arch-item .actions .delete { border-color: #c44; color: #c44; }
        .arch-empty { text-align: center; padding: 40px 16px; color: #666; }
        .arch-empty a { color: var(--accent-hope); }
    </style>
</head>
<body class="sna-has-nav">

<!--#include nav-->

<div class="archived-wrap">
    <h1>Campanhas Arquivadas</h1>
    <div class="sub">Arquivo morto. Campanhas arquivadas são mantidas por até 10 — as mais antigas são removidas automaticamente.</div>
    <div id="arch-list"></div>
</div>

<!--#include footer-->

<script>
function loadArchived() {
    var raw = localStorage.getItem("sna-campaigns");
    var list = raw ? JSON.parse(raw) : [];
    var archived = list.filter(function (c) { return c.archived; });
    var container = document.getElementById("arch-list");
    if (archived.length === 0) {
        container.innerHTML = '<div class="arch-empty">Nenhuma campanha arquivada.<br><a href="missioncontrol.html">Ir para Controle da Missão</a></div>';
        return;
    }
    var html = "";
    for (var i = 0; i < archived.length; i++) {
        var c = archived[i];
        var date = c.createdAt ? new Date(c.createdAt).toLocaleString("pt-BR") : "data desconhecida";
        html += '<div class="arch-item">'
            + '<div class="info">'
            + '<div class="name">' + esc(c.name) + '</div>'
            + '<div class="meta">' + date + '</div>'
            + '</div>'
            + '<div class="actions">'
            + '<button class="restore" onclick="restoreCampaign(\'' + c.id + '\')">Restaurar</button>'
            + '<button class="delete" onclick="deleteCampaign(\'' + c.id + '\')">Excluir</button>'
            + '</div>'
            + '</div>';
    }
    container.innerHTML = html;
}

function esc(s) {
    var d = document.createElement("div");
    d.appendChild(document.createTextNode(s));
    return d.innerHTML;
}

function restoreCampaign(id) {
    var raw = localStorage.getItem("sna-campaigns");
    var list = raw ? JSON.parse(raw) : [];
    for (var i = 0; i < list.length; i++) {
        if (list[i].id === id) {
            list[i].archived = false;
            break;
        }
    }
    localStorage.setItem("sna-campaigns", JSON.stringify(list));
    loadArchived();
}

function deleteCampaign(id) {
    if (!confirm("Excluir permanentemente esta campanha?")) return;
    var raw = localStorage.getItem("sna-campaigns");
    var list = raw ? JSON.parse(raw) : [];
    list = list.filter(function (c) { return c.id !== id; });
    localStorage.setItem("sna-campaigns", JSON.stringify(list));
    loadArchived();
}

loadArchived();
</script>

<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js?v=4").catch(function (e) { console.warn("Spaceships and Aliens: SW registration failed", e); });
}
</script>


</body>
</html>
