<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WARP-Unit | Controle da Missão</title>
    <link rel="stylesheet" href="warp.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<header>
    <h1>SISTEMA OPERACIONAL WARP</h1>
    <p>Controle da Missão &mdash; Painel do Mestre</p>
</header>

<div class="mc-back-link">
    <button class="back-btn" onclick="location.href='mothership.html'">&larr; Retornar à Nave</button>
</div>

<div class="mc-page active">

    <!-- PONTOS DE MEDO (GM) -->
    <div class="mc-section">
        <div class="mc-section-title">Recursos do Mestre</div>
        <div class="mc-character-card">
            <div class="mc-character-header">
                <span class="mc-character-name">PONTOS DE MEDO</span>
                <span class="mc-fear-counter" id="fear-counter">0/7</span>
            </div>
            <div class="mc-token-row" id="fear-token-row"></div>
            <div class="mc-actions">
                <button class="mc-btn fear" onclick="adjustFear(-1)">Gastar (-1)</button>
                <button class="mc-btn fear" onclick="adjustFear(1)">Adicionar (+1)</button>
                <button class="mc-btn fear ml-auto" onclick="resetFear()">Zerar</button>
            </div>
        </div>

        <div class="mc-character-card">
            <div class="mc-character-header">
                <span class="mc-character-name">ROLADOR D20</span>
                <span class="mc-fear-counter" id="d20-result">--</span>
            </div>
            <div class="dice-container" id="d20-viewport"></div>
            <div class="mc-actions">
                <button class="roll-btn" onclick="rollD20()">Rolar D20</button>
            </div>
        </div>
    </div>

    <!-- PERSONAGENS -->
    <div class="mc-section">
        <div class="mc-section-title">Unidades em Campo</div>
        <div id="characters-container"></div>
    </div>

    <!-- NPCs -->
    <div class="mc-section">
        <div class="mc-section-title">PNJs &amp; Aliados</div>
        <div id="npcs-container"></div>
    </div>

</div>

<footer>
    <a href="docs/">Documentação</a>
    &nbsp;·&nbsp;
    <a href="mothership.html">Nave-Mãe</a>
    &nbsp;·&nbsp;
    <a href="index.html">Catálogo de Unidades</a>
    &nbsp;·&nbsp;
    <a href="oneshot.html">Gerador de Missão</a>
    &nbsp;·&nbsp;
    <a href="#" onclick="localStorage.removeItem('warp-unit-mission');location.reload();return false;">Limpar Missão</a>
</footer>

<script>
// ===== STATE =====
const STORAGE_KEY = "warp-unit-mission";
const FEAR_MAX = 7;
const NPC_MAX = 20;
const NPC_START = 5;

const NPC_NAMES = ["PNJ 1", "PNJ 2", "PNJ 3"];

let state = {
    fear: 0,
    robots: {},
    npcs: [NPC_START, NPC_START, NPC_START]
};

// Load state
function loadState() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
            const saved = JSON.parse(raw);
            state.fear = typeof saved.fear === "number" ? saved.fear : 0;
            state.robots = saved.robots || {};
            state.npcs = Array.isArray(saved.npcs) ? saved.npcs : [NPC_START, NPC_START, NPC_START];
        }
    } catch (e) {}
}

function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

// ===== FEAR POINTS =====
function renderFearTokens() {
    const row = document.getElementById("fear-token-row");
    row.innerHTML = "";
    for (let i = 0; i < FEAR_MAX; i++) {
        const token = document.createElement("div");
        token.className = `mc-token fear ${i >= state.fear ? 'spent' : ''}`;
        token.title = i < state.fear ? `Medo ${i+1}/${FEAR_MAX}` : "Vazio";
        token.addEventListener("click", () => setFear(i + 1));
        row.appendChild(token);
    }
    document.getElementById("fear-counter").textContent = `${state.fear}/${FEAR_MAX}`;
}

function setFear(val) {
    state.fear = Math.max(0, Math.min(FEAR_MAX, val));
    saveState();
    renderFearTokens();
}

function adjustFear(amount) {
    setFear(state.fear + amount);
}

function resetFear() {
    setFear(0);
}

// ===== CHARACTERS =====
function renderCharacterCard(robot) {
    const id = robot.id;
    const model = robot.model;
    const type = robot.type;
    const maxEnergy = robot.maxEnergy;
    const starting = robot.startingEnergy;

    // Ensure robot has an entry in state
    if (typeof state.robots[id] !== "number") {
        state.robots[id] = starting;
    }
    const current = state.robots[id];

    const card = document.createElement("div");
    card.className = "mc-character-card";
    card.id = "char-" + id;

    const header = document.createElement("div");
    header.className = "mc-character-header";
    header.innerHTML = `
        <div>
            <div class="mc-character-name">${model}</div>
            <div class="mc-character-type">${type}</div>
        </div>
        <span class="mc-energy-counter" id="ce-${id}">${current}/${maxEnergy}</span>
    `;
    card.appendChild(header);

    const tokenRow = document.createElement("div");
    tokenRow.className = "mc-token-row";
    tokenRow.id = "tr-" + id;

    for (let i = 0; i < maxEnergy; i++) {
        const token = document.createElement("div");
        token.className = `mc-token energy ${i >= current ? 'spent' : ''}`;
        token.addEventListener("click", () => setRobotEnergy(id, i + 1));
        tokenRow.appendChild(token);
    }
    card.appendChild(tokenRow);

    const actions = document.createElement("div");
    actions.className = "mc-actions";
    actions.innerHTML = `
        <button class="mc-btn" onclick="adjustRobotEnergy('${id}', -1)">Gastar (-1)</button>
        <button class="mc-btn" onclick="adjustRobotEnergy('${id}', 1)">Adicionar (+1)</button>
        <button class="mc-btn ml-auto" onclick="resetRobotEnergy('${id}')">Recarregar</button>
    `;
    card.appendChild(actions);

    return card;
}

function setRobotEnergy(id, val) {
    const robot = ROBOTS.find(r => r.id === id);
    if (!robot) return;
    state.robots[id] = Math.max(0, Math.min(robot.maxEnergy, val));
    saveState();
    renderAll();
}

function adjustRobotEnergy(id, amount) {
    const robot = ROBOTS.find(r => r.id === id);
    if (!robot) return;
    state.robots[id] = Math.max(0, Math.min(robot.maxEnergy, (state.robots[id] || robot.startingEnergy) + amount));
    saveState();
    renderAll();
}

function resetRobotEnergy(id) {
    const robot = ROBOTS.find(r => r.id === id);
    if (!robot) return;
    state.robots[id] = robot.startingEnergy;
    saveState();
    renderAll();
}

// ===== NPCS =====
function renderNPC(index) {
    const name = NPC_NAMES[index];
    const current = state.npcs[index];

    const card = document.createElement("div");
    card.className = "mc-character-card";
    card.id = "npc-card-" + index;

    const header = document.createElement("div");
    header.className = "mc-character-header";
    header.innerHTML = `
        <span class="mc-character-name">${name}</span>
        <span class="mc-npc-counter" id="npc-counter-${index}">${current}/${NPC_MAX}</span>
    `;
    card.appendChild(header);

    const tokenRow = document.createElement("div");
    tokenRow.className = "mc-token-row";
    tokenRow.id = "npc-tr-" + index;

    for (let i = 0; i < NPC_MAX; i++) {
        const token = document.createElement("div");
        token.className = `mc-token npc ${i >= current ? 'spent' : ''}`;
        token.addEventListener("click", () => setNPCEnergy(index, i + 1));
        tokenRow.appendChild(token);
    }
    card.appendChild(tokenRow);

    const actions = document.createElement("div");
    actions.className = "mc-actions";
    actions.innerHTML = `
        <button class="mc-btn npc" onclick="adjustNPCEnergy(${index}, -1)">Gastar (-1)</button>
        <button class="mc-btn npc" onclick="adjustNPCEnergy(${index}, 1)">Adicionar (+1)</button>
        <button class="mc-btn npc ml-auto" onclick="resetNPCEnergy(${index})">Recarregar</button>
    `;
    card.appendChild(actions);

    return card;
}

function setNPCEnergy(index, val) {
    state.npcs[index] = Math.max(0, Math.min(NPC_MAX, val));
    saveState();
    renderAll();
}

function adjustNPCEnergy(index, amount) {
    state.npcs[index] = Math.max(0, Math.min(NPC_MAX, state.npcs[index] + amount));
    saveState();
    renderAll();
}

function resetNPCEnergy(index) {
    state.npcs[index] = NPC_START;
    saveState();
    renderAll();
}

// ===== RENDER ALL =====
let ROBOTS = [];

function renderAll() {
    // Fear
    renderFearTokens();

    // Characters
    const container = document.getElementById("characters-container");
    container.innerHTML = "";
    if (!ROBOTS.length) {
        container.innerHTML = '<div class="mc-empty">Nenhuma unidade disponível. Carregando...</div>';
        return;
    }

    // Sort by model name for consistent order
    const sorted = [...ROBOTS].sort((a, b) => a.model.localeCompare(b.model));
    sorted.forEach(robot => {
        container.appendChild(renderCharacterCard(robot));
    });

    // NPCs
    const npcContainer = document.getElementById("npcs-container");
    npcContainer.innerHTML = "";
    for (let i = 0; i < NPC_NAMES.length; i++) {
        npcContainer.appendChild(renderNPC(i));
    }
}

// ===== INIT =====
async function init() {
    loadState();

    try {
        const res = await fetch("data/robots.json");
        ROBOTS = await res.json();
    } catch (e) {
        document.getElementById("characters-container").innerHTML =
            '<div class="mc-empty">Erro ao carregar unidades. Verifique data/robots.json</div>';
    }

    renderAll();
}

init();

// ===== D20 DICE (Three.js) =====
let d20Scene, d20Camera, d20Renderer, d20Die, d20Anim, d20Result;
let d20Ready = false;

function createD20(hexColor, textColor) {
    const group = new THREE.Group();
    const R = 1.05;
    const geo = new THREE.IcosahedronGeometry(R, 0);
    const ni = geo.clone().toNonIndexed();
    const arr = ni.getAttribute('position').array;
    const fs = 3;

    let uvs = ni.getAttribute('uv');
    if (!uvs) {
        uvs = new THREE.BufferAttribute(new Float32Array(arr.length / 3 * 2), 2);
        ni.setAttribute('uv', uvs);
    }
    const uvArr = uvs.array;

    ni.clearGroups();
    const mats = [];
    const norms = [];

    for (let f = 0; f < 20; f++) {
        ni.addGroup(f * fs, fs, f);

        const keys = [];
        const uniqueMap = new Map();
        for (let v = 0; v < fs; v++) {
            const i = (f * fs + v) * 3;
            const key = `${arr[i].toFixed(4)},${arr[i+1].toFixed(4)},${arr[i+2].toFixed(4)}`;
            keys.push(key);
            if (!uniqueMap.has(key))
                uniqueMap.set(key, [arr[i], arr[i+1], arr[i+2]]);
        }

        const verts = Array.from(uniqueMap.values()).map(c => new THREE.Vector3(c[0], c[1], c[2]));
        const center = new THREE.Vector3();
        verts.forEach(v => center.add(v));
        center.divideScalar(verts.length);
        norms.push(center.clone().normalize());

        const local = verts.map(v => v.clone().sub(center));
        const faceNormal = center.clone().normalize();
        const axX = local[0].clone().normalize();
        const axY = new THREE.Vector3().crossVectors(faceNormal, axX).normalize();

        let uMin = Infinity, uMax = -Infinity, vMin = Infinity, vMax = -Infinity;
        const uvVals = local.map(p => {
            const u = p.dot(axX), v = p.dot(axY);
            uMin = Math.min(uMin, u); uMax = Math.max(uMax, u);
            vMin = Math.min(vMin, v); vMax = Math.max(vMax, v);
            return { u, v };
        });
        const uRng = uMax - uMin || 1, vRng = vMax - vMin || 1;

        const uvByKey = new Map();
        let ki = 0;
        for (const key of uniqueMap.keys()) {
            uvByKey.set(key, { u: (uvVals[ki].u - uMin) / uRng + 0.15, v: (uvVals[ki].v - vMin) / vRng + 0.02 });
            ki++;
        }

        for (let v = 0; v < fs; v++) {
            const uv = uvByKey.get(keys[v]);
            const ui = (f * fs + v) * 2;
            uvArr[ui] = uv.u;
            uvArr[ui + 1] = uv.v;
        }

        const cv = document.createElement('canvas');
        cv.width = 256; cv.height = 256;
        const ctx = cv.getContext('2d');
        ctx.fillStyle = hexColor;
        ctx.fillRect(0, 0, 256, 256);
        ctx.fillStyle = textColor;
        ctx.font = 'Bold 110px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(String(f + 1), 128, 130);

        mats.push(new THREE.MeshStandardMaterial({
            map: new THREE.CanvasTexture(cv),
            roughness: 0.45, metalness: 0.1,
        }));
    }

    uvs.needsUpdate = true;

    group.add(new THREE.Mesh(ni, mats));
    group.userData.faceNormals = norms;

    const edgeMat = new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.15 });
    group.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo), edgeMat));

    return group;
}

function initD20() {
    const container = document.getElementById('d20-viewport');
    if (!container || typeof THREE === 'undefined') return;

    const w = container.clientWidth || 400;
    const h = 220;

    d20Scene = new THREE.Scene();
    d20Camera = new THREE.PerspectiveCamera(40, w / h, 0.1, 100);
    d20Camera.position.set(0, 0.2, 3.6);
    d20Camera.lookAt(0, 0, 0);

    d20Renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    d20Renderer.setSize(w, h);
    d20Renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    d20Renderer.setClearColor(0x000000, 0);
    container.appendChild(d20Renderer.domElement);

    const ambient = new THREE.AmbientLight(0xffffff, 0.7);
    const key = new THREE.DirectionalLight(0xffffff, 0.8);
    key.position.set(3, 4, 5);
    const fill = new THREE.DirectionalLight(0xffffff, 0.3);
    fill.position.set(-3, 1, -4);
    d20Scene.add(ambient, key, fill);

    d20Die = createD20('#ffffff', '#000000');
    d20Scene.add(d20Die);

    d20Ready = true;
    d20RenderLoop();
}

function d20RenderLoop() {
    if (!d20Ready) return;
    requestAnimationFrame(d20RenderLoop);

    if (d20Anim) {
        const now = Date.now();
        const t = Math.min((now - d20Anim.t0) / d20Anim.dur, 1);
        const e = 1 - Math.pow(1 - t, 3);
        d20Die.rotation.x = d20Anim.sx + (d20Anim.tx - d20Anim.sx) * e;
        d20Die.rotation.y = d20Anim.sy + (d20Anim.ty - d20Anim.sy) * e;
        d20Die.rotation.z = d20Anim.sz + (d20Anim.tz - d20Anim.sz) * e;
        if (t >= 1) {
            d20Die.rotation.set(d20Anim.tx, d20Anim.ty, d20Anim.tz);
            d20Anim = null;
            document.getElementById('d20-result').textContent = d20Result;
        }
    } else {
        d20Die.rotation.y += 0.002;
    }

    d20Renderer.render(d20Scene, d20Camera);
}

function rollD20() {
    if (!d20Ready || !d20Die) return;

    d20Result = Math.floor(Math.random() * 20) + 1;

    const camPos = new THREE.Vector3(0, 0.2, 3.6);
    const toCamera = camPos.clone().sub(d20Die.position).normalize();
    const fn = d20Die.userData.faceNormals[d20Result - 1];
    const q = new THREE.Quaternion().setFromUnitVectors(fn, toCamera);
    const te = new THREE.Euler().setFromQuaternion(q);
    const sx = d20Die.rotation.x, sy = d20Die.rotation.y, sz = d20Die.rotation.z;

    d20Anim = {
        t0: Date.now(), dur: 1200 + Math.random() * 300,
        sx, sy, sz,
        tx: te.x + Math.PI * 2 * (3 + Math.floor(Math.random() * 4)),
        ty: te.y + Math.PI * 2 * (4 + Math.floor(Math.random() * 4)),
        tz: te.z + Math.PI * 2 * (1 + Math.floor(Math.random() * 3))
    };

    document.getElementById('d20-result').textContent = '...';
}

window.addEventListener('load', () => setTimeout(initD20, 100));
</script>
</body>
</html>
